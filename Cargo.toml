[package]
name        = "bin-package-manager"
version     = "0.2.1"
edition     = "2024"
description = "A binary package manager based on GitHub Releases"
readme      = "README.md"
homepage    = "https://github.com/lxl66566/bpm-rs"
repository  = "https://github.com/lxl66566/bpm-rs"
license     = "MIT"
keywords    = ["binary", "github-releases", "package-manager"]
categories  = ["command-line-utilities"]
exclude     = ["AGENTS.md", "architecture-select"]

[[bin]]
name = "bpm"
path = "src/main.rs"

[dependencies]
anyhow              = "1"
architecture-select = { path = "architecture-select", version = "0.2.0" }
backon = "1.6.0"
bpm-trauma          = { path = "trauma", version = "3.0.0", features = ["rustls"] }
brotli              = "8"
bzip2               = "0.6"
bzip3               = { version = "0.12", features = ["bundled"] }
clap                = { version = "4.6", features = ["derive"] }
colored             = "3"
comfy-table         = "8"
config-file2        = { version = "0.7", features = ["all"] }
dialoguer           = { version = "0.12", features = ["fuzzy-select"] }
flate2              = "1"
flexi_logger        = { version = "0.31", optional = true }
fs4 = "1.1.0"
fs_extra            = "1.3"
home                = "0.5"
log                 = "0.4"
lz4_flex            = "0.14"
lzma-rust2          = "0.19"
path-absolutize     = "4"
reqwest             = { version = "0.13", features = ["json"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sevenz-rust2        = { version = "0.21" }
snap                = "1"
strum_macros        = "0.28"
tar                 = "0.4"
tempfile            = "3"
tokio               = { version = "1.52", features = ["macros", "rt", "rt-multi-thread", "signal"] }
url                 = { version = "2", features = ["serde"] }
walkdir             = "2.5"
zip                 = "8.6"
zstd                = "0.13"

[build-dependencies]
zstd = "0.13"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-env = "0.3.0"

[features]
default = ["bin"]
bin     = ["flexi_logger"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
# No panic=abort: unwinding lets a panic inside a spawned tokio task surface
# as a JoinError (which cli_install/cli_update handle with rollback) instead
# of aborting the whole process mid-install, leaving an inconsistent state.
