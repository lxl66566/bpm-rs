[package]
name        = "bin-package-manager"
version     = "0.3.1"
edition     = "2024"
description = "A binary package manager based on GitHub Releases"
repository  = "https://github.com/lxl66566/bpm-rs"
license     = "MIT"
keywords    = ["binary", "github-releases", "package-manager"]
categories  = ["command-line-utilities"]
include     = ["/LICENSE", "/README.md", "/build.rs", "/shim.rs", "/src", "/test_assets/", "/tests/"]

# Package + workspace root: the root package is a member implicitly, listed
# here for clarity. resolver 3 matches edition 2024.
[workspace]
resolver = "3"
members  = [".", "architecture-select", "trauma"]

[[bin]]
name              = "bpm"
path              = "src/main.rs"
# src/log.rs needs the optional flexi_logger; skip the bin when the
# feature is off (e.g. --no-default-features library-only builds).
required-features = ["bin"]

[dependencies]
anyhow                     = "1"
architecture-select        = { path = "architecture-select", version = "0.2.0" }
backon                     = "1.6.0"
bin-package-manager-trauma = { path = "trauma", version = "3.0.0", features = ["rustls"] }
brotli                     = "9"
bzip2                      = "0.6"
bzip3                      = { version = "0.13", features = ["bundled"] }
clap                       = { version = "4.6", features = ["derive"] }
colored                    = { version = "3", optional = true }
comfy-table                = "8"
config-file2               = { version = "0.8", features = ["all"] }
dialoguer                  = { version = "0.12", features = ["fuzzy-select"] }
flate2                     = "1"
flexi_logger               = { version = "0.31", optional = true }
fs_extra                   = "1.3"
fs4                        = "1.1.0"
home                       = "0.5"
log                        = "0.4"
lz4_flex                   = "0.14"
lzma-rust2                 = "0.24"
path-absolutize            = "4"
reqwest                    = { version = "0.13", features = ["json"] }
serde                      = { version = "1", features = ["derive"] }
serde_json                 = "1"
sevenz-rust2               = { version = "0.24" }
snap                       = "1"
strum_macros               = "0.28"
tar                        = "0.4"
tempfile                   = "3"
tokio                      = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal"] }
url                        = { version = "2", features = ["serde"] }
walkdir                    = "2.5"
zip                        = "9"
zstdx                      = "0.3"

[build-dependencies]
zstdx = "0.3"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-env = "0.3"

[features]
default = ["bin"]
# Feature gating the [[bin]] target: src/log.rs needs flexi_logger + colored.
bin     = ["colored", "flexi_logger"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
# No panic=abort: unwinding lets a panic inside a spawned tokio task surface
# as a JoinError (which cli_install/cli_update handle with rollback) instead
# of aborting the whole process mid-install, leaving an inconsistent state.
